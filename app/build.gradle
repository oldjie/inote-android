plugins { id 'com.android.application' }

android {
    buildFeatures { buildConfig true }
    useLibrary 'android.test.base'
    namespace 'com.personal.inote'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.oldjie.inote.community'
        buildConfigField 'String', 'IMPORT_KEY', groovy.json.JsonOutput.toJson(providers.gradleProperty('inoteImportKey').getOrElse(''))
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-community'
        testInstrumentationRunner 'com.personal.inote.PersonalTestRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint { abortOnError true }
}
